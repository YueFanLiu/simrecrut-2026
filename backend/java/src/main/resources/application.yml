server:
  port: ${JAVA_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: simrecrut-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jmx:
    enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: OPENAPI_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: false
    validator-url: ""
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: list
    default-models-expand-depth: 0
    urls-primary-name: all
    display-request-duration: true
  packages-to-scan: fr.isep.simrecrut.controller
  override-with-generic-response: false
  writer-with-order-by-keys: true
  group-configs:
    - group: all
      paths-to-match: /api/v1/**
    - group: authentication
      paths-to-match: /api/v1/auth/**
    - group: administration
      paths-to-match: /api/v1/admin/**
    - group: resumes
      paths-to-match: /api/v1/resumes, /api/v1/resumes/**
    - group: jobs
      paths-to-match: /api/v1/hr/jobs, /api/v1/hr/jobs/**, /api/v1/candidate/jobs, /api/v1/candidate/jobs/**

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

simrecrut:
  jobs:
    matching-rule-version: ${JOB_MATCHING_RULE_VERSION:}
    rule-root: ${JOB_RULE_ROOT:model_artifacts/rules}
    extraction-model: ${JOB_EXTRACTION_MODEL:deepseek-chat}
  mail:
    from: ${SMTP_FROM:}
  ml:
    base-url: ${ML_BASE_URL}
    internal-token: ${ML_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 10s
  extraction:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL}
      api-key: ${DEEPSEEK_API_KEY}
  storage:
    case-workspace: ${CASE_WORKSPACE_PATH}
    model-artifacts: ${MODEL_ARTIFACTS_PATH}
  registration:
    code-ttl: 10m
    resend-cooldown: 60s
    max-code-attempts: 5
    max-email-sends-per-hour: 5
    max-ip-sends-per-hour: 30
    max-global-sends-per-hour: 500
    max-ip-verifications-per-ten-minutes: 60
    code-secret: ${REGISTRATION_CODE_SECRET:}

  authentication:
    token-ttl: 30m
    issuer: https://simrecrut.local
    audience: simrecrut-api
    signing-secret: ${JWT_SIGNING_SECRET:}
    clock-skew: 30s
    login-window: 15m
    lock-duration: 15m
    max-failed-attempts: 5
    max-account-attempts: 20
    ip-window: 10m
    max-ip-attempts: 60
