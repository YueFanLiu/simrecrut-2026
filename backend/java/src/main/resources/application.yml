# RuoYi owns identity, permissions, MyBatis and the Redis token store.
server:
  port: ${JAVA_PORT:8080}
spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: simrecrut-ruoyi
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
      slave:
        enabled: false
      initialSize: 1
      minIdle: 1
      maxActive: 10
      maxWait: 10000
      connectTimeout: 10000
      socketTimeout: 30000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      statViewServlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  messages:
    basename: i18n/messages
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
ruoyi:
  name: SimRecrut
  version: 3.9.2
  copyrightYear: 2026
  profile: ${RUOYI_PROFILE:runtime/ruoyi-files}
  addressEnabled: false
  captchaType: math
token:
  header: Authorization
  secret: ${RUOYI_TOKEN_SECRET}
  expireTime: 30
user:
  password:
    maxRetryCount: 5
    lockTime: 10
mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
simrecrut:
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
  registration:
    enabled: ${SIMRECRUT_REGISTRATION_ENABLED:true}
  resumes:
    directory: ${SIMRECRUT_DATA_DIR:runtime/resumes}
