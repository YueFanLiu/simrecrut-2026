      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                    - 0
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionView"
                  message:
                    type: string
                  requestId:
                    type: string
                required:
                - code
