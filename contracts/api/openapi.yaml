openapi: 3.0.3
info:
  description: "Implemented backend routes only. Live database/provider integration\
    \ is not certified by this document. Job deployment requires V6 and a frozen matching\
    \ rule. Independent account management requires V7. Candidate case workflows require\
    \ V8 and compatible frozen protocols/models. Start with registration/login, then\
    \ authorize with data.accessToken. Business API errors use code/message/requestId/data.\
    \ Success code is zero."
  title: SimRecrut Backend API
  version: 0.1.0
servers:
- description: The same backend that serves this documentation
  url: /
security:
- bearerAuth: []
