[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "simrecrut-ml"
version = "0.1.0"
description = "Offline data review and PyTorch development tools for SimRecrut"
requires-python = ">=3.12"
dependencies = ["pyarrow==24.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
training = ["torch==2.10.0"]
extraction = ["jsonschema==4.26.0", "pypdf==6.8.0"]

[project.scripts]
simrecrut-ml = "simrecrut_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simrecrut_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
